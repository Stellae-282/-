
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>운동일지 & 벌금 관리</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#f5f6f8;
  color:#222
}
.container{
  max-width:900px;
  margin:auto;
  padding:24px 16px 50px
}
h1{margin:0 0 6px;font-size:30px}
.subtitle{color:#777;margin-bottom:22px}

.card,.user-box,.weekbar,.record,.members,.history{
  background:white;
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.06)
}

.user-box{margin-bottom:18px}

.login-row{
  display:flex;
  align-items:center;
  gap:12px
}

.profile{
  flex:1;
  display:flex;
  align-items:center;
  gap:10px
}

.profile img{
  width:42px;
  height:42px;
  border-radius:50%
}

.login-name{font-weight:700}
.login-email{font-size:12px;color:#777;margin-top:3px}

.google-btn{
  background:white;
  color:#333;
  border:1px solid #ddd;
  box-shadow:0 1px 3px rgba(0,0,0,.08)
}

.logout-btn{
  background:#e9eaed;
  color:#333
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px
}

.label{color:#777;font-size:14px;margin-bottom:8px}
.value{font-size:25px;font-weight:700}

.weekbar{margin-bottom:18px}

.week-nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

button{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  cursor:pointer;
  font-size:14px;
  background:#222;
  color:white
}

button.secondary{
  background:#e9eaed;
  color:#333
}

button.danger{background:#d93025}

.week-title{
  font-weight:700;
  font-size:18px;
  text-align:center
}

.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
  margin-top:16px
}

.day{
  background:#f0f1f3;
  border-radius:12px;
  padding:12px 5px;
  text-align:center;
  cursor:pointer;
  border:2px solid transparent
}

.day:hover{transform:translateY(-1px)}
.day.checked{
  background:#e5f7ea;
  border-color:#35a853
}
.day .dow{font-size:13px;color:#666}
.day .date{font-size:16px;font-weight:700;margin:6px 0}
.day .status{font-size:20px}

.record{margin-bottom:18px}
.record h2{margin:0 0 5px}
.hint{color:#777;font-size:13px;margin-bottom:16px}

label{
  display:block;
  font-weight:700;
  margin:14px 0 7px
}

input,textarea{
  width:100%;
  border:1px solid #d5d7db;
  border-radius:9px;
  padding:11px;
  font-size:15px;
  font-family:inherit
}

textarea{min-height:110px;resize:vertical}

.record-actions{
  display:flex;
  gap:8px;
  margin-top:16px
}

.status-box{
  margin-top:18px;
  margin-bottom:18px;
  padding:15px;
  border-radius:10px;
  background:#f1f3f4;
  font-weight:700
}

.status-box.warning{
  background:#fff0f0;
  color:#c5221f
}

.status-box.success{
  background:#e8f5e9;
  color:#188038
}

.members{margin-bottom:18px}
.members h2,.history h2{margin-top:0}

.member-row,.history-row{
  display:grid;
  grid-template-columns:1.2fr .8fr .8fr;
  gap:8px;
  padding:11px 0;
  border-bottom:1px solid #eee;
  font-size:14px
}

.member-row:last-child,.history-row:last-child{
  border-bottom:0
}

.member-header{font-weight:700}
.empty{color:#888;padding:10px 0}

.login-screen{
  text-align:center;
  padding:40px 20px
}

.login-screen button{
  margin-top:15px
}

.footer{
  text-align:center;
  color:#888;
  font-size:12px;
  margin-top:20px
}

@media(max-width:650px){
  .container{padding:18px 10px 35px}
  h1{font-size:25px}
  .summary{grid-template-columns:1fr}
  .days{gap:4px}
  .day{padding:9px 2px}
  .day .dow{font-size:11px}
  .day .date{font-size:13px}
  .day .status{font-size:17px}
  .week-nav button{padding:8px 9px}
  .week-title{font-size:15px}
  .login-row{align-items:stretch}
  .profile{min-width:0}
  .login-row{flex-wrap:wrap}
}
</style>
</head>

<body>

<div class="container">

<h1>🏋️ 운동일지</h1>
<div class="subtitle">일주일에 4일 이상 운동하기</div>

<!-- 로그인 -->
<div class="user-box">

  <div id="loginScreen" class="login-screen">
    <div style="font-size:18px;font-weight:700;">
      👤 로그인해주세요
    </div>

    <div style="color:#777;font-size:13px;margin-top:7px;">
      Google 계정으로 로그인하면 운동 기록을 사용할 수 있습니다.
    </div>

    <button class="google-btn" onclick="googleLogin()">
      🔵 Google로 로그인
    </button>
  </div>

  <div id="userScreen" style="display:none">

    <div class="login-row">

      <div class="profile">

        <img id="profileImage" src="" alt="프로필">

        <div>
          <div class="login-name" id="userName"></div>
          <div class="login-email" id="userEmail"></div>
        </div>

      </div>

      <button class="logout-btn" onclick="logout()">
        로그아웃
      </button>

    </div>

  </div>

</div>


<div id="app" style="display:none">

  <div class="summary">

    <div class="card">
      <div class="label">이번 주 운동</div>
      <div class="value" id="weeklyCount">0 / 7일</div>
    </div>

    <div class="card">
      <div class="label">이번 주 벌금</div>
      <div class="value" id="weeklyFine">0원</div>
    </div>

    <div class="card">
      <div class="label">누적 벌금</div>
      <div class="value" id="totalFine">0원</div>
    </div>

  </div>


  <div class="weekbar">

    <div class="week-nav">

      <button class="secondary" onclick="moveWeek(-1)">
        ← 이전 주
      </button>

      <div class="week-title" id="weekTitle"></div>

      <button class="secondary" onclick="moveWeek(1)">
        다음 주 →
      </button>

    </div>

    <div style="text-align:center;margin-top:10px">
      <button onclick="goToday()">이번 주로</button>
    </div>

    <div class="days" id="days"></div>

  </div>


  <div class="record">

    <h2 id="recordTitle">날짜를 선택하세요</h2>

    <div class="hint">
      운동한 날을 선택하면 운동 기록을 작성할 수 있습니다.
    </div>

    <label>운동 종류</label>
    <input id="exercise" placeholder="예: 헬스, 러닝, 등 운동">

    <label>운동 시간</label>
    <input id="duration" placeholder="예: 1시간 20분">

    <label>운동 내용 / 메모</label>

    <textarea id="memo"
      placeholder="오늘 한 운동이나 느낀 점을 적어보세요."></textarea>

    <div class="record-actions">

      <button onclick="saveRecord()">
        💾 저장
      </button>

      <button class="danger" onclick="deleteRecord()">
        기록 삭제
      </button>

    </div>

  </div>


  <div class="status-box" id="statusBox"></div>


  <div class="members">

    <h2>👥 전체 사용자 현황</h2>

    <div id="members">
      <div class="empty">불러오는 중...</div>
    </div>

  </div>


  <div class="history">

    <h2>📊 지난 기록</h2>

    <div id="history"></div>

  </div>

</div>


<div class="footer">
  데이터는 Firebase에 온라인으로 저장됩니다.
</div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAk0ovw6FMvRhofW6WVLW8sPyqrXrsDOxY",
  authDomain: "workout-program-4aef3.firebaseapp.com",
  databaseURL: "https://workout-program-4aef3-default-rtdb.firebaseio.com",
  projectId: "workout-program-4aef3",
  storageBucket: "workout-program-4aef3.firebasestorage.app",
  messagingSenderId: "357131248868",
  appId: "1:357131248868:web:ded5a62445d9661548b8f1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const googleProvider = new firebase.auth.GoogleAuthProvider();

let currentUser = null;
let myData = {};
let selectedDate = null;
let currentWeekStart = getMonday(new Date());

const DOW = ["월","화","수","목","금","토","일"];


/* =========================
   Google 로그인
========================= */

function googleLogin(){

  auth.signInWithPopup(googleProvider)

  .catch(error => {

    console.error(error);

    if(error.code === "auth/popup-blocked"){
      alert("브라우저에서 팝업이 차단되었습니다.");
    }
    else if(error.code === "auth/unauthorized-domain"){
      alert(
        "Firebase에서 stellae-282.github.io 도메인을 승인된 도메인에 추가해주세요."
      );
    }
    else{
      alert("Google 로그인에 실패했습니다.\n" + error.message);
    }

  });

}


function logout(){

  if(!confirm("로그아웃할까요?")) return;

  auth.signOut();

}


/* =========================
   로그인 상태
========================= */

auth.onAuthStateChanged(async user => {

  currentUser = user;

  if(user){

    document.getElementById("loginScreen").style.display="none";

    document.getElementById("userScreen").style.display="block";

    document.getElementById("app").style.display="block";

    document.getElementById("userName").textContent =
      user.displayName || "사용자";

    document.getElementById("userEmail").textContent =
      user.email || "";

    document.getElementById("profileImage").src =
      user.photoURL ||
      "https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg";

    await createUserIfNeeded();

    await loadMyData();

    listenMembers();

  }
  else{

    document.getElementById("loginScreen").style.display="block";

    document.getElementById("userScreen").style.display="none";

    document.getElementById("app").style.display="none";

  }

});


/* =========================
   사용자 생성
========================= */

async function createUserIfNeeded(){

  const ref =
    db.ref("users/" + currentUser.uid);

  const snapshot =
    await ref.once("value");

  if(!snapshot.exists()){

    await ref.set({

      name:
        currentUser.displayName || "사용자",

      email:
        currentUser.email || "",

      photoURL:
        currentUser.photoURL || "",

      records:{}

    });

  }

}


/* =========================
   내 데이터
========================= */

async function loadMyData(){

  const snapshot =
    await db.ref(
      "users/" + currentUser.uid
    ).once("value");

  myData =
    snapshot.val() || {};

  render();

}


/* =========================
   날짜
========================= */

function dateKey(date){

  const y=date.getFullYear();

  const m=String(
    date.getMonth()+1
  ).padStart(2,"0");

  const d=String(
    date.getDate()
  ).padStart(2,"0");

  return `${y}-${m}-${d}`;

}


function parseKey(key){

  const [y,m,d]=
    key.split("-").map(Number);

  return new Date(y,m-1,d);

}


function getMonday(date){

  const d=new Date(date);

  d.setHours(0,0,0,0);

  const day=d.getDay();

  const diff=
    day===0 ? -6 : 1-day;

  d.setDate(d.getDate()+diff);

  return d;

}


function addDays(date,n){

  const d=new Date(date);

  d.setDate(d.getDate()+n);

  return d;

}


function getWeekDates(start){

  return Array.from(
    {length:7},
    (_,i)=>addDays(start,i)
  );

}


function money(n){

  return n.toLocaleString("ko-KR")+"원";

}


/* =========================
   주간 벌금
========================= */

function weekFine(start,records=myData.records||{}){

  const dates=
    getWeekDates(start);

  const count=
    dates.filter(
      d=>records[dateKey(d)]?.done
    ).length;

  return count<4 ? 5000 : 0;

}


/* =========================
   누적 벌금
========================= */

function calculateTotalFine(records=myData.records||{}){

  const weeks={};

  Object.keys(records).forEach(key=>{

    const monday=
      getMonday(parseKey(key));

    weeks[dateKey(monday)]=true;

  });

  let total=0;

  Object.keys(weeks).forEach(wk=>{

    total+=
      weekFine(parseKey(wk),records);

  });

  return total;

}


/* =========================
   화면
========================= */

function render(){

  const dates=
    getWeekDates(currentWeekStart);

  const records=
    myData.records||{};

  const count=
    dates.filter(
      d=>records[dateKey(d)]?.done
    ).length;

  const first=dates[0];
  const last=dates[6];

  document.getElementById("weekTitle").textContent=
    `${first.getFullYear()}.${String(first.getMonth()+1).padStart(2,"0")}.${String(first.getDate()).padStart(2,"0")} ~ ${last.getFullYear()}.${String(last.getMonth()+1).padStart(2,"0")}.${String(last.getDate()).padStart(2,"0")}`;

  document.getElementById("weeklyCount").textContent=
    `${count} / 7일`;

  document.getElementById("weeklyFine").textContent=
    money(weekFine(currentWeekStart));

  document.getElementById("totalFine").textContent=
    money(calculateTotalFine());


  const daysEl=
    document.getElementById("days");

  daysEl.innerHTML="";


  dates.forEach((date,i)=>{

    const key=dateKey(date);

    const rec=records[key];

    const div=
      document.createElement("div");

    div.className=
      "day"+(rec?.done?" checked":"");

    div.onclick=
      ()=>selectDate(date);

    div.innerHTML=`

      <div class="dow">${DOW[i]}</div>

      <div class="date">
        ${date.getMonth()+1}/${date.getDate()}
      </div>

      <div class="status">
        ${rec?.done?"✅":"○"}
      </div>

    `;

    daysEl.appendChild(div);

  });


  updateStatus(count);

  renderHistory();

  if(selectedDate)
    loadSelected();

}


/* =========================
   상태
========================= */

function updateStatus(count){

  const box=
    document.getElementById("statusBox");

  if(count>=4){

    box.className=
      "status-box success";

    box.textContent=
      `🎉 이번 주 목표 달성! ${count}일 운동했습니다. 벌금은 없습니다.`;

  }
  else{

    box.className=
      "status-box warning";

    box.textContent=
      `⚠️ 현재 ${count}일 운동했습니다. ${4-count}일 더 운동해야 이번 주 벌금을 피할 수 있습니다.`;

  }

}


/* =========================
   날짜 선택
========================= */

function selectDate(date){

  selectedDate=
    dateKey(date);

  loadSelected();

}


function loadSelected(){

  if(!selectedDate) return;

  const records=
    myData.records||{};

  const rec=
    records[selectedDate]||{};

  const date=
    parseKey(selectedDate);

  document.getElementById("recordTitle").textContent=
    `📝 ${date.getFullYear()}년 ${date.getMonth()+1}월 ${date.getDate()}일 기록`;

  document.getElementById("exercise").value=
    rec.exercise||"";

  document.getElementById("duration").value=
    rec.duration||"";

  document.getElementById("memo").value=
    rec.memo||"";

}


/* =========================
   기록 저장
========================= */

function saveRecord(){

  if(!currentUser){

    alert("먼저 Google 로그인을 해주세요.");

    return;

  }

  if(!selectedDate){

    alert("먼저 날짜를 선택해주세요.");

    return;

  }

  const record={

    done:true,

    exercise:
      document.getElementById("exercise").value.trim(),

    duration:
      document.getElementById("duration").value.trim(),

    memo:
      document.getElementById("memo").value.trim()

  };


  db.ref(
    "users/" +
    currentUser.uid +
    "/records/" +
    selectedDate
  )
  .set(record)

  .then(()=>{

    if(!myData.records)
      myData.records={};

    myData.records[selectedDate]=record;

    render();

    alert("운동 기록이 저장되었습니다!");

  })

  .catch(error=>{

    console.error(error);

    alert("저장에 실패했습니다.\n"+error.message);

  });

}


/* =========================
   기록 삭제
========================= */

function deleteRecord(){

  if(!selectedDate){

    alert("먼저 날짜를 선택해주세요.");

    return;

  }

  if(!confirm("이 날짜의 운동 기록을 삭제할까요?"))
    return;

  db.ref(
    "users/" +
    currentUser.uid +
    "/records/" +
    selectedDate
  )
  .remove()

  .then(()=>{

    if(myData.records)
      delete myData.records[selectedDate];

    loadSelected();

    render();

  });

}


/* =========================
   주 이동
========================= */

function moveWeek(n){

  currentWeekStart=
    addDays(currentWeekStart,n*7);

  selectedDate=null;

  document.getElementById("recordTitle").textContent=
    "날짜를 선택하세요";

  document.getElementById("exercise").value="";
  document.getElementById("duration").value="";
  document.getElementById("memo").value="";

  render();

}


function goToday(){

  currentWeekStart=
    getMonday(new Date());

  selectedDate=null;

  render();

}


/* =========================
   전체 사용자
========================= */

function listenMembers(){

  db.ref("users").on("value",snapshot=>{

    renderMembers(
      snapshot.val()||{}
    );

  });

}


function renderMembers(users){

  const el=
    document.getElementById("members");

  const list=
    Object.entries(users);

  if(!list.length){

    el.innerHTML=
      '<div class="empty">등록된 사용자가 없습니다.</div>';

    return;

  }


  const weekStart=
    getMonday(new Date());

  const weekDates=
    getWeekDates(weekStart);


  let html=`

    <div class="member-row member-header">
      <div>이름</div>
      <div>이번 주</div>
      <div>누적 벌금</div>
    </div>

  `;


  list.forEach(([uid,user])=>{

    const records=
      user.records||{};

    const count=
      weekDates.filter(
        d=>records[dateKey(d)]?.done
      ).length;

    const fine=
      calculateTotalFine(records);

    html+=`

      <div class="member-row">

        <div>
          ${escapeHtml(user.name||"사용자")}
        </div>

        <div>
          ${count} / 7일
        </div>

        <div>
          ${money(fine)}
        </div>

      </div>

    `;

  });


  el.innerHTML=html;

}


/* =========================
   지난 기록
========================= */

function renderHistory(){

  const el=
    document.getElementById("history");

  const records=
    myData.records||{};

  const weeks={};

  Object.keys(records).forEach(key=>{

    const monday=
      dateKey(
        getMonday(parseKey(key))
      );

    weeks[monday]=true;

  });


  const list=
    Object.keys(weeks)
      .map(key=>parseKey(key))
      .sort((a,b)=>b-a);


  if(!list.length){

    el.innerHTML=
      '<div class="empty">아직 저장된 운동 기록이 없습니다.</div>';

    return;

  }


  el.innerHTML=`

    <div class="history-row"
         style="font-weight:700">

      <div>주차</div>
      <div>운동</div>
      <div>벌금</div>

    </div>

    ${list.map(start=>{

      const dates=
        getWeekDates(start);

      const count=
        dates.filter(
          d=>records[dateKey(d)]?.done
        ).length;

      const fine=
        weekFine(start,records);

      return `

        <div class="history-row">

          <div>
            ${start.getFullYear()}.
            ${start.getMonth()+1}.
            ${start.getDate()} 주
          </div>

          <div>
            ${count} / 7일
          </div>

          <div>
            ${money(fine)}
          </div>

        </div>

      `;

    }).join("")}

  `;

}


/* =========================
   HTML 보안
========================= */

function escapeHtml(text){

  return String(text)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
```
